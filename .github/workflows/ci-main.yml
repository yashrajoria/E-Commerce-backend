# CI for pull requests and feature branches — vet + test every Go module,
# pytest for agent-service, Spectral OpenAPI lint. No image pushes, no deploys.
#
# Secrets: none required. Deploy/publish lives in ci-aws.yml (main branch only).

name: CI - main

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  go-vet-and-test:
    name: Go ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: api-gateway
            path: backend/api-gateway
          - module: pkg/aws
            path: backend/pkg/aws
          - module: common
            path: backend/pkg/common
          - module: identity-service
            path: backend/services/identity-service
          - module: catalog-service
            path: backend/services/catalog-service
          - module: order-service
            path: backend/services/order-service
          - module: notification-service
            path: backend/services/notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: |
            backend/api-gateway/go.sum
            backend/pkg/aws/go.sum
            backend/pkg/common/go.sum
            backend/services/identity-service/go.sum
            backend/services/catalog-service/go.sum
            backend/services/order-service/go.sum
            backend/services/notification-service/go.sum

      - name: Download modules
        run: go mod download
        working-directory: ${{ matrix.path }}

      - name: go vet
        run: go vet ./...
        working-directory: ${{ matrix.path }}

      - name: go build
        run: go build ./...
        working-directory: ${{ matrix.path }}

      - name: go test
        run: go test ./... -count=1
        working-directory: ${{ matrix.path }}

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
        working-directory: ${{ matrix.path }}
        continue-on-error: true

  migrations:
    name: Migrations and schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: postgres://postgres:pw@localhost:5432/ecommerce?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: |
            backend/pkg/common/go.sum
            backend/services/identity-service/go.sum
            backend/services/order-service/go.sum
            backend/services/notification-service/go.sum

      - name: Install golang-migrate
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate

      - name: Apply all migrations
        run: migrate -path backend/migrations -database "$DB_URL" up

      - name: Roll back everything and re-apply
        run: |
          migrate -path backend/migrations -database "$DB_URL" down -all
          migrate -path backend/migrations -database "$DB_URL" up

      - name: Every constraint is validated
        run: |
          n=$(psql "$DB_URL" -Atc "SELECT count(*) FROM pg_constraint WHERE NOT convalidated")
          test "$n" = "0"

      # AutoMigrate must have nothing left to do on a migrations-only database;
      # otherwise the SQL migrations and the Go models have drifted apart.
      # Last step: it mutates the database.
      - name: Schema drift and purge tests
        env:
          SCHEMA_DRIFT_DB_URL: ${{ env.DB_URL }}
          TEST_DATABASE_URL: ${{ env.DB_URL }}
        run: |
          for m in pkg/common services/identity-service services/order-service services/notification-service; do
            (cd backend/$m && go test -count=1 -run 'AutoMigrate|Purge' ./...)
          done

  agent-pytest:
    name: Python agent-service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/services/agent-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend/services/agent-service

      - name: Byte-compile Python files (syntax check)
        run: python -m compileall app/
        working-directory: backend/services/agent-service

      - name: Run pytest
        run: python -m pytest -q
        working-directory: backend/services/agent-service

      - name: Run pip-audit (vulnerability scan)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        working-directory: backend/services/agent-service
        continue-on-error: true

  openapi-lint:
    name: Spectral OpenAPI lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint OpenAPI spec
        run: npx @stoplight/spectral-cli lint docs/openapi.yaml
        working-directory: backend

  docker-build-check:
    name: Docker build ${{ matrix.service }}
    needs: [go-vet-and-test, agent-pytest]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity-service
            dockerfile: backend/services/identity-service/Dockerfile
            context: ./backend
          - service: catalog-service
            dockerfile: backend/services/catalog-service/Dockerfile
            context: ./backend
          - service: order-service
            dockerfile: backend/services/order-service/Dockerfile
            context: ./backend
          - service: notification-service
            dockerfile: backend/services/notification-service/Dockerfile
            context: ./backend
          - service: api-gateway
            dockerfile: backend/api-gateway/Dockerfile
            context: ./backend
          - service: agent-service
            dockerfile: backend/services/agent-service/Dockerfile
            context: ./backend/services/agent-service
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker build (dry-run, no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-render:
    name: Deploy to Render
    needs: [go-vet-and-test, agent-pytest, openapi-lint, docker-build-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deployment..."
            curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deployment triggered successfully!"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set, skipping automatic deploy hook."
          fi
