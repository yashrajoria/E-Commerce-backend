name: CI - ShopSwift Backend

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Terraform"]
    types:
      - completed

permissions:
  contents: read

env:
  DEPLOY_DIR: /home/${{ secrets.INPUT_USERNAME }}/E-Commerce-backend/backend

jobs:
  build-and-test:
    name: Build and test services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - catalog-service
          - order-service
          - api-gateway
          - notification-service
        include:
          - service: api-gateway
            go_module: api-gateway
            min_coverage: 10
          - service: notification-service
            go_module: services/notification-service
            min_coverage: 10
          - service: identity-service
            go_module: services/identity-service
            min_coverage: 10
          - service: catalog-service
            go_module: services/catalog-service
            min_coverage: 2
          - service: order-service
            go_module: services/order-service
            min_coverage: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: |
            backend/services/${{ matrix.service }}/go.sum
            backend/api-gateway/go.sum

      - name: Download modules
        run: go mod download
        working-directory: backend/${{ matrix.go_module }}

      - name: Run tests with coverage
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic -v
          echo "=== Coverage Summary ==="
          go tool cover -func=coverage.out | tail -1
          # Coverage floor: measured baseline 2026-10-01
          # gateway: 14.1%, catalog: 2.2%, order: 24.3%, notification: 12.1%, identity: 18.5%
          # Threshold: service floor — blocks regressions below current baseline
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          MIN_COV=${{ matrix.min_coverage }}
          if (( $(echo "$COVERAGE < $MIN_COV" | bc -l) )); then
            echo "FAIL: Coverage $COVERAGE% is below $MIN_COV% threshold"
            exit 1
          fi
          echo "PASS: Coverage $COVERAGE% meets $MIN_COV% threshold"
        working-directory: backend/${{ matrix.go_module }}

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
        working-directory: backend/${{ matrix.go_module }}
        continue-on-error: true

  agent-service-test:
    name: Test agent-service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/services/agent-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend/services/agent-service

      - name: Run pytest
        run: python -m pytest -q
        working-directory: backend/services/agent-service

      - name: Run pip-audit (vulnerability scan)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        working-directory: backend/services/agent-service
        continue-on-error: true

  docker-build-and-push:
    name: Build and push Docker images
    needs: [build-and-test, agent-service-test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity-service
            dockerfile: backend/services/identity-service/Dockerfile
            context: ./backend
          - service: catalog-service
            dockerfile: backend/services/catalog-service/Dockerfile
            context: ./backend
          - service: order-service
            dockerfile: backend/services/order-service/Dockerfile
            context: ./backend
          - service: notification-service
            dockerfile: backend/services/notification-service/Dockerfile
            context: ./backend
          - service: api-gateway
            dockerfile: backend/api-gateway/Dockerfile
            context: ./backend
          - service: agent-service
            dockerfile: backend/services/agent-service/Dockerfile
            context: ./backend/services/agent-service
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          # Build context must match each Dockerfile's COPY paths.
          # Go services COPY relative to backend/ (pkg/aws, services/common, ...).
          # agent-service is Python and self-contained with its own context.
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-to-ec2:
    name: Deploy to EC2
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      DEPLOY_DIR: /home/ubuntu/E-Commerce-backend/backend
      SCRIPTS_DIR: /home/ubuntu/scripts
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Sync .env from Terraform outputs
      - name: Populate .env from Terraform outputs
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [ -f backend/infrastructure/terraform/terraform-outputs.json ]; then
            chmod +x backend/infrastructure/aws/populate_env_from_terraform.sh
            backend/infrastructure/aws/populate_env_from_terraform.sh
          else
            echo "terraform-outputs.json not found, proceeding with checked-in .env"
          fi

      # Ensure target directories exist on EC2
      - name: Ensure DEPLOY_DIR and SCRIPTS_DIR exist
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.INPUT_HOST }}
          username: ${{ secrets.INPUT_USERNAME }}
          key: ${{ secrets.INPUT_KEY }}
          script: |
            mkdir -p "${{ env.DEPLOY_DIR }}"
            mkdir -p "${{ env.SCRIPTS_DIR }}"

      # Copy backend code and configs to EC2
      - name: Copy backend/services to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.INPUT_HOST }}
          username: ${{ secrets.INPUT_USERNAME }}
          key: ${{ secrets.INPUT_KEY }}
          source: "backend/services"
          target: "${{ env.DEPLOY_DIR }}"
          strip_components: 1

      - name: Copy backend/pkg to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.INPUT_HOST }}
          username: ${{ secrets.INPUT_USERNAME }}
          key: ${{ secrets.INPUT_KEY }}
          source: "backend/pkg"
          target: "${{ env.DEPLOY_DIR }}"
          strip_components: 1

      - name: Copy backend/api-gateway to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.INPUT_HOST }}
          username: ${{ secrets.INPUT_USERNAME }}
          key: ${{ secrets.INPUT_KEY }}
          source: "backend/api-gateway"
          target: "${{ env.DEPLOY_DIR }}"
          strip_components: 1

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.INPUT_HOST }}
          username: ${{ secrets.INPUT_USERNAME }}
          key: ${{ secrets.INPUT_KEY }}
          source: "backend/docker-compose.yml"
          target: "${{ env.DEPLOY_DIR }}"
          strip_components: 0
      - name: Copy docker-compose.deploy.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.INPUT_HOST }}
          username: ${{ secrets.INPUT_USERNAME }}
          key: ${{ secrets.INPUT_KEY }}
          source: "backend/docker-compose.deploy.yml"
          target: "${{ env.DEPLOY_DIR }}"
          strip_components: 0
      - name: Copy .env to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.INPUT_HOST }}
          username: ${{ secrets.INPUT_USERNAME }}
          key: ${{ secrets.INPUT_KEY }}
          source: "backend/.env"
          target: "${{ env.DEPLOY_DIR }}/.env"
          strip_components: 0

      # Copy deploy scripts
      - name: Copy deployment scripts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.INPUT_HOST }}
          username: ${{ secrets.INPUT_USERNAME }}
          key: ${{ secrets.INPUT_KEY }}
          source: "backend/infrastructure/aws/*.sh"
          target: "${{ env.SCRIPTS_DIR }}"
          strip_components: 3

      # Run deployment script on EC2
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GIT_SHA: ${{ github.sha }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.INPUT_HOST }}
          username: ${{ secrets.INPUT_USERNAME }}
          key: ${{ secrets.INPUT_KEY }}
          envs: DOCKERHUB_USERNAME,GIT_SHA,DEPLOY_DIR
          script: |
            set -euo pipefail
            DEPLOY_SCRIPT="${{ env.SCRIPTS_DIR }}/deploy_to_ec2.sh"
            echo "🚀 Starting deployment..."
            echo "   DOCKERHUB_USERNAME: ${DOCKERHUB_USERNAME}"
            echo "   GIT_SHA: ${GIT_SHA}"
            echo "   DEPLOY_DIR: ${DEPLOY_DIR}"

            if [ -f "${DEPLOY_SCRIPT}" ]; then
              chmod +x "${DEPLOY_SCRIPT}"
              export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}"
              export GIT_SHA="${GIT_SHA}"
              export DEPLOY_DIR="${DEPLOY_DIR}"
              cd "${DEPLOY_DIR}"
              bash "${DEPLOY_SCRIPT}"
            else
              echo "Error: Deployment script not found at ${DEPLOY_SCRIPT}"
              ls -la "${{ env.SCRIPTS_DIR }}"
              exit 1
            fi

      # Health check with retry
      - name: Post-deploy health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.INPUT_HOST }}
          username: ${{ secrets.INPUT_USERNAME }}
          key: ${{ secrets.INPUT_KEY }}
          script: |
            set -euo pipefail
            echo "⏳ Waiting for services to start..."
            sleep 10
            MAX_RETRIES=6
            RETRY_DELAY=5
            for i in $(seq 1 $MAX_RETRIES); do
              echo "[healthcheck] Attempt $i/$MAX_RETRIES - checking api-gateway at http://localhost:8080/health"
              if curl -fS --max-time 10 http://localhost:8080/health; then
                echo "[healthcheck] SUCCESS - api-gateway is healthy"
                exit 0
              else
                if [ $i -lt $MAX_RETRIES ]; then
                  echo "⚠️  [healthcheck] Failed, retrying in ${RETRY_DELAY}s..."
                  sleep $RETRY_DELAY
                fi
              fi
            done
            echo "[healthcheck] FAILED after $MAX_RETRIES attempts"
            echo "📋 Container status:"
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
            echo "📋 Recent api-gateway logs:"
            docker logs --tail 50 api-gateway || echo "Could not fetch logs"
            exit 1
