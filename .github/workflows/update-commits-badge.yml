name: Update Commits Badge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Count commits
        id: count
        run: |
          COMMIT_COUNT=$(git rev-list --count origin/main)
          echo "count=$COMMIT_COUNT" >> $GITHUB_OUTPUT

      - name: Update gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "$GIST_TOKEN" ]; then
            echo "GIST_TOKEN secret is not set. Skipping gist update."
            exit 0
          fi

          cat > badge.json << 'EOF'
          {
            "schemaVersion": 1,
            "label": "commits",
            "message": "${{ steps.count.outputs.count }}",
            "color": "blue"
          }
          EOF

          PAYLOAD=$(python3 -c 'import json, sys; content = sys.stdin.read().strip(); print(json.dumps({"files": {"commits-badge.json": {"content": content}}}))' < badge.json)

          curl -s -f -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            https://api.github.com/gists/68669c1c711655a41895753490af2898 || {
              echo "Warning: Failed to update gist badge"
              exit 0
            }
