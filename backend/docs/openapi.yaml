      operationId: adminListUsers
      description: |
        Returns a paginated list of all registered users (customers and admins).
        Passwords are never included in the response. Results are sorted by
        creation date descending (newest first). Requires admin role.
      parameters:
        - $ref: "#/components/parameters/AdminAuthorizationHeader"
        - $ref: "#/components/parameters/AdminUserIDHeader"
        - $ref: "#/components/parameters/AdminUserRoleHeader"
        - $ref: "#/components/parameters/AdminPageParam"
        - $ref: "#/components/parameters/AdminPageSizeParam"
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            email:
                              type: string
                              format: email
                            name:
                              type: string
                            role:
                              type: string
                              enum: [user, admin]
                            phone_number:
                              type: string
                              nullable: true
                            created_at:
                              type: string
                              format: date-time
                      meta:
                        type: object
                        properties:
                          page:
                            type: integer
                          page_size:
                            type: integer
                          total:
                            type: integer
                          total_pages:
                            type: integer
                  error:
                    type: string
              example:
                success: true
                data:
                  users:
                    - id: "e3bc8bbb-aee3-445c-b51a-0b3edee3b613"
                      email: "admin@example.com"
                      name: "Admin User"
                      role: "admin"
                      phone_number: null
                      created_at: "2026-03-10T01:46:38Z"
                  meta:
                    page: 1
                    page_size: 20
                    total: 23
                    total_pages: 2
                error: ""
