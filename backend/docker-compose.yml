services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ecommerce
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "listen_addresses=*"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - ecommerce-network

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    volumes:
      - ./services/auth-service:/app
      - ./services/common:/common
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
      - AUTH_SNS_TOPIC_ARN=${AUTH_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:auth-events}
      - NOTIFICATION_SNS_TOPIC_ARN=${NOTIFICATION_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:notification-events}
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    restart: unless-stopped
    volumes:
      - ./services/user-service:/app
      - ./services/common:/common
      - ./pkg/aws:/pkg/aws
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - ORDER_SNS_TOPIC_ARN=${ORDER_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:order-events}
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    restart: unless-stopped
    volumes:
      - ./services/product-service:/app
      - ./services/common:/common
      - ./pkg/aws:/pkg/aws
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-shopswift}
      - AWS_S3_PREFIX=products/
      - DDB_TABLE_PRODUCTS=${DDB_TABLE_PRODUCTS:-Products}
      - DDB_TABLE_CATEGORIES=${DDB_TABLE_CATEGORIES:-Categories}
      - INVENTORY_SERVICE_URL=http://inventory-service:8084
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
      - PRODUCT_SNS_TOPIC_ARN=${PRODUCT_SNS_TOPIC_ARN:-}
    networks:
      - ecommerce-network

  cart-service:
    build:
      context: .
      dockerfile: services/cart-service/Dockerfile
    restart: unless-stopped
    volumes:
      - ./services/cart-service:/app
      - ./services/common:/common
      - ./pkg/aws:/pkg/aws
    ports:
      - "8086:8086"
    env_file:
      - .env
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - ORDER_SNS_TOPIC_ARN=${ORDER_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:order-events}
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-network

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    restart: unless-stopped
    volumes:
      - ./services/inventory-service:/app
      - ./services/common:/common
      - ./pkg/aws:/pkg/aws
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - DDB_TABLE=${DDB_TABLE:-Inventory}
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
    networks:
      - ecommerce-network

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    restart: unless-stopped
    volumes:
      - ./services/order-service:/app
      - ./services/common:/common
      - ./pkg/aws:/pkg/aws
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - INVENTORY_SERVICE_URL=${INVENTORY_SERVICE_URL:-http://inventory-service:8084}
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
      - ORDER_SNS_TOPIC_ARN=${ORDER_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:order-events}
      - NOTIFICATION_SNS_TOPIC_ARN=${NOTIFICATION_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:notification-events}
      - STORE_CURRENCY=${STORE_CURRENCY:-USD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    restart: unless-stopped
    volumes:
      - ./services/payment-service:/app
      - ./services/common:/common
      - ./pkg/aws:/pkg/aws
    ports:
      - "8087:8087"
    env_file:
      - .env
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
      - PAYMENT_SNS_TOPIC_ARN=${PAYMENT_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:payment-events}
      - NOTIFICATION_SNS_TOPIC_ARN=${NOTIFICATION_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:notification-events}
      - STORE_CURRENCY=${STORE_CURRENCY:-USD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  promotion-service:
    build:
      context: .
      dockerfile: services/promotion-service/Dockerfile
    restart: unless-stopped
    volumes:
      - ./services/promotion-service:/app
      - ./services/common:/common
      - ./pkg/aws:/pkg/aws
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      - PORT=8090
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - PROMOTION_SNS_TOPIC_ARN=arn:aws:sns:us-east-1:000000000000:promotion-events
      - NOTIFICATION_SNS_TOPIC_ARN=arn:aws:sns:us-east-1:000000000000:notification-events
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  shipping-service:
    build:
      context: .
      dockerfile: services/shipping-service/Dockerfile
    restart: unless-stopped
    volumes:
      - ./services/shipping-service:/app
      - ./services/common:/common
      - ./pkg/aws:/pkg/aws
    ports:
      - "8091:8091"
    env_file:
      - .env
    environment:
      - PORT=8091
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - SHIPPO_API_KEY=${SHIPPO_API_KEY:-}
      - SHIPPING_SNS_TOPIC_ARN=arn:aws:sns:us-east-1:000000000000:shipping-events
      - NOTIFICATION_SNS_TOPIC_ARN=arn:aws:sns:us-east-1:000000000000:notification-events
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    volumes:
      - ./services/notification-service:/app
      - ./services/common:/common
      - ./pkg/aws:/pkg/aws
    ports:
      - "8092:8092"
    env_file:
      - .env
    environment:
      - PORT=8092
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - SQS_QUEUE_URL=${NOTIFICATION_SQS_QUEUE_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_EMAIL:-}
      - SMTP_PASS=${SMTP_PASSWORD:-}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ecommerce
      - POSTGRES_SSLMODE=disable
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./api-gateway:/app
      - ./services/common:/common
      - ./pkg/aws:/pkg/aws
    env_file:
      - .env
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - AWS_ENDPOINT=${AWS_ENDPOINT:-}
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
      # FIX: Override REDIS_URL here so the redis:// scheme from .env never
      # reaches main.go. redis.Options.Addr expects "host:port" only.
      - REDIS_URL=redis:6379
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      order-service:
        condition: service_started
      user-service:
        condition: service_started
      cart-service:
        condition: service_started
      payment-service:
        condition: service_started
      promotion-service:
        condition: service_started
      shipping-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - ecommerce-network

  bff-service:
    build:
      context: .
      dockerfile: services/bff-service/Dockerfile
    restart: unless-stopped
    volumes:
      - ./services/bff-service:/app
      - ./docs:/docs:ro
      - ./services/common:/common
      - ./pkg/aws:/pkg/aws
    ports:
      - "8088:8088"
    env_file:
      - .env
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
      - REDIS_URL=redis://redis:6379/0
      - REQUEST_TIMEOUT=40s
      - API_GATEWAY_URL=http://api-gateway:8080
      - ANALYTICS_SERVICE_URL=http://analytics-service:8093
      - NOTIFICATION_SERVICE_URL=http://notification-service:8092
      - REVIEW_SERVICE_URL=http://review-service:8094
      - PROMOTION_SERVICE_URL=http://promotion-service:8090
      - SHIPPING_SERVICE_URL=http://shipping-service:8091
    depends_on:
      api-gateway:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - ecommerce-network

  agent-service:
    build:
      context: ./services/agent-service
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./services/agent-service:/app
    ports:
      - "8089:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=info
      - HOST=0.0.0.0
      - PORT=8000
      # Direct to bff-service — do NOT route through api-gateway (circular)
      - BFF_BASE_URL=http://bff-service:8088
      - BFF_TIMEOUT=15
      # FIX: Set your current active ngrok URL here.
      # Free ngrok tunnels change on restart — use a static domain:
      #   ngrok http --domain=your-fixed-name.ngrok-free.app 11434
      - LLM_SERVICE_URL=${LLM_SERVICE_URL}
      - LLM_TIMEOUT=30
      - CONCURRENT_TOOL_LIMIT=10
    depends_on:
      - bff-service
    networks:
      - ecommerce-network

  stripe-cli:
    image: stripe/stripe-cli:latest
    restart: unless-stopped
    command: listen --forward-to http://api-gateway:8080/stripe/webhook
    env_file:
      - .env
    depends_on:
      - api-gateway
    networks:
      - ecommerce-network

  docs:
    image: swaggerapi/swagger-ui:latest
    restart: unless-stopped
    ports:
      - "8099:8080"
    volumes:
      - ./docs/openapi.yaml:/tmp/openapi.yaml:ro
    environment:
      - SWAGGER_JSON=/tmp/openapi.yaml
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
