services:
  postgres:
    # Pinned (was postgres:latest) — an unpinned tag can jump major versions
    # on a routine `docker compose pull`/rebuild and break wire compatibility
    # or silently require a manual data migration.
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ecommerce
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "listen_addresses=*"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - ecommerce-network

  redis:
    # Pinned (was redis:7, major-version only) for reproducible rebuilds.
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    # No source bind-mount here: the Dockerfile builds a static binary and
    # ENTRYPOINT runs that binary directly, so mounting source over it would
    # do nothing but mislead readers into thinking hot-reload works.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
      - AUTH_SNS_TOPIC_ARN=${AUTH_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:auth-events}
      - NOTIFICATION_SNS_TOPIC_ARN=${NOTIFICATION_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:notification-events}
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NAME=${ADMIN_NAME:-Administrator}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    restart: unless-stopped
    # No source bind-mount here: the Dockerfile builds a static binary and
    # ENTRYPOINT runs that binary directly, so mounting source over it would
    # do nothing but mislead readers into thinking hot-reload works.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8085/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - ORDER_SNS_TOPIC_ARN=${ORDER_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:order-events}
      - AUTH_SERVICE_URL=http://auth-service:8081
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - ecommerce-network

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    restart: unless-stopped
    # No source bind-mount: static-binary image, ENTRYPOINT runs it directly.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-shopswift}
      - AWS_S3_PREFIX=products/
      - ASSET_PUBLIC_BASE_URL=${ASSET_PUBLIC_BASE_URL:-http://localhost:4566}
      - AWS_CLOUDFRONT_DOMAIN=${AWS_CLOUDFRONT_DOMAIN:-}
      - DDB_TABLE_PRODUCTS=${DDB_TABLE_PRODUCTS:-Products}
      - DDB_TABLE_CATEGORIES=${DDB_TABLE_CATEGORIES:-Categories}
      - DDB_TABLE_PRODUCT_CATEGORIES=${DDB_TABLE_PRODUCT_CATEGORIES:-ProductCategories}
      - INVENTORY_SERVICE_URL=http://inventory-service:8084
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
      - PRODUCT_SNS_TOPIC_ARN=${PRODUCT_SNS_TOPIC_ARN:-}
    networks:
      - ecommerce-network

  cart-service:
    build:
      context: .
      dockerfile: services/cart-service/Dockerfile
    restart: unless-stopped
    # No source bind-mount: static-binary image, ENTRYPOINT runs it directly.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8086/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - ORDER_SNS_TOPIC_ARN=${ORDER_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:order-events}
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-network

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    restart: unless-stopped
    # No source bind-mount: static-binary image, ENTRYPOINT runs it directly.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - DDB_TABLE=${DDB_TABLE:-Inventory}
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
    networks:
      - ecommerce-network

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    restart: unless-stopped
    # No source bind-mount: static-binary image, ENTRYPOINT runs it directly.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - INVENTORY_SERVICE_URL=${INVENTORY_SERVICE_URL:-http://inventory-service:8084}
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
      - ORDER_SNS_TOPIC_ARN=${ORDER_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:order-events}
      - NOTIFICATION_SNS_TOPIC_ARN=${NOTIFICATION_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:notification-events}
      - STORE_CURRENCY=${STORE_CURRENCY:-USD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    restart: unless-stopped
    # No source bind-mount: static-binary image, ENTRYPOINT runs it directly.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8087/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
      - PAYMENT_SNS_TOPIC_ARN=${PAYMENT_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:payment-events}
      - NOTIFICATION_SNS_TOPIC_ARN=${NOTIFICATION_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:notification-events}
      - STORE_CURRENCY=${STORE_CURRENCY:-USD}
      # Stripe success/cancel must hit the storefront (not admin on :3000).
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  promotion-service:
    build:
      context: .
      dockerfile: services/promotion-service/Dockerfile
    restart: unless-stopped
    # No source bind-mount: static-binary image, ENTRYPOINT runs it directly.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - PORT=8090
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - PROMOTION_SNS_TOPIC_ARN=arn:aws:sns:us-east-1:000000000000:promotion-events
      - NOTIFICATION_SNS_TOPIC_ARN=arn:aws:sns:us-east-1:000000000000:notification-events
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  shipping-service:
    build:
      context: .
      dockerfile: services/shipping-service/Dockerfile
    restart: unless-stopped
    # No source bind-mount: static-binary image, ENTRYPOINT runs it directly.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8091/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - PORT=8091
    networks:
      - ecommerce-network

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    # No source bind-mount: static-binary image (templates are baked in via
    # the Dockerfile's COPY --from=builder), ENTRYPOINT runs it directly.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8092/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - PORT=8092
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - SQS_QUEUE_URL=${NOTIFICATION_SQS_QUEUE_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_EMAIL:-}
      - SMTP_PASS=${SMTP_PASSWORD:-}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ecommerce
      - POSTGRES_SSLMODE=disable
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No source bind-mount here: the Dockerfile builds a static binary and
    # ENTRYPOINT runs that binary directly, so mounting source over it would
    # do nothing but mislead readers into thinking hot-reload works.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - AWS_ENDPOINT=${AWS_ENDPOINT:-}
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
      # FIX: Override REDIS_URL here so the redis:// scheme from .env never
      # reaches main.go. redis.Options.Addr expects "host:port" only.
      - REDIS_URL=redis:6379
      - RATE_LIMIT_GLOBAL=${RATE_LIMIT_GLOBAL:-1000}
      - RATE_LIMIT_STRICT=${RATE_LIMIT_STRICT:-30}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      # Comma-separated CIDRs of reverse proxies allowed to set
      # X-Forwarded-For (e.g. an ALB/nginx in front of this container). Left
      # unset here because nothing sits in front of the gateway in this
      # compose stack — gin.ClientIP() then trusts no forwarded header at
      # all, closing the IP-spoofing gap that made rate limiting bypassable.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      promotion-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - ecommerce-network

  bff-service:
    build:
      context: .
      dockerfile: services/bff-service/Dockerfile
    restart: unless-stopped
    # ./docs is a real runtime dependency (main.go serves /docs/openapi.yaml
    # from this path) — kept. The service-source/common/pkg mounts are not:
    # the Dockerfile builds a static binary and ENTRYPOINT runs that binary
    # directly, so they did nothing but mislead readers into thinking
    # hot-reload works.
    volumes:
      - ./docs:/docs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8088/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
      - REDIS_URL=redis://redis:6379/0
      - REQUEST_TIMEOUT=40s
      - API_GATEWAY_URL=http://api-gateway:8080
      - NOTIFICATION_SERVICE_URL=http://notification-service:8092
      - PROMOTION_SERVICE_URL=http://promotion-service:8090
      - SHIPPING_SERVICE_URL=http://shipping-service:8091
    depends_on:
      api-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-network

  agent-service:
    build:
      context: ./services/agent-service
      dockerfile: Dockerfile
    restart: unless-stopped
    # Kept (unlike the Go services above): this image runs `uvicorn` directly
    # against /app with no compile step, so the mount is a real dev
    # convenience, not a vestigial leftover.
    volumes:
      - ./services/agent-service:/app
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - ENVIRONMENT=development
      - LOG_LEVEL=info
      - HOST=0.0.0.0
      - PORT=8000
      # Direct to bff-service — do NOT route through api-gateway (circular)
      - BFF_BASE_URL=http://bff-service:8088
      - BFF_TIMEOUT=15
      # FIX: Set your current active ngrok URL here.
      # Free ngrok tunnels change on restart — use a static domain:
      #   ngrok http --domain=your-fixed-name.ngrok-free.app 11434
      - LLM_SERVICE_URL=${LLM_SERVICE_URL}
      - LLM_TIMEOUT=30
      - CONCURRENT_TOOL_LIMIT=10
    depends_on:
      bff-service:
        condition: service_healthy
    networks:
      - ecommerce-network

  stripe-cli:
    image: stripe/stripe-cli:latest
    restart: unless-stopped
    command: listen --forward-to http://api-gateway:8080/stripe/webhook
    env_file:
      - .env
    depends_on:
      - api-gateway
    networks:
      - ecommerce-network

  docs:
    image: swaggerapi/swagger-ui:latest
    restart: unless-stopped
    ports:
      - "8099:8080"
    volumes:
      - ./docs/openapi.yaml:/tmp/openapi.yaml:ro
    environment:
      - SWAGGER_JSON=/tmp/openapi.yaml
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

