services:
  postgres:
    # Pinned (was postgres:latest) — an unpinned tag can jump major versions
    # on a routine `docker compose pull`/rebuild and break wire compatibility
    # or silently require a manual data migration.
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ecommerce
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "listen_addresses=*"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - ecommerce-network

  redis:
    # Pinned (was redis:7, major-version only) for reproducible rebuilds.
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    restart: unless-stopped
    # No source bind-mount here: the Dockerfile builds a static binary and
    # ENTRYPOINT runs that binary directly, so mounting source over it would
    # do nothing but mislead readers into thinking hot-reload works.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
      - AUTH_SNS_TOPIC_ARN=${AUTH_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:auth-events}
      - NOTIFICATION_SNS_TOPIC_ARN=${NOTIFICATION_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:notification-events}
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NAME=${ADMIN_NAME:-Administrator}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    restart: unless-stopped
    # No source bind-mount: static-binary image, ENTRYPOINT runs it directly.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 384m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-shopswift}
      - AWS_S3_PREFIX=products/
      - ASSET_PUBLIC_BASE_URL=${ASSET_PUBLIC_BASE_URL:-http://localhost:4566}
      - AWS_CLOUDFRONT_DOMAIN=${AWS_CLOUDFRONT_DOMAIN:-}
      - DDB_TABLE_PRODUCTS=${DDB_TABLE_PRODUCTS:-Products}
      - DDB_TABLE_CATEGORIES=${DDB_TABLE_CATEGORIES:-Categories}
      - DDB_TABLE_PRODUCT_CATEGORIES=${DDB_TABLE_PRODUCT_CATEGORIES:-ProductCategories}
      - DDB_TABLE_INVENTORY=${DDB_TABLE_INVENTORY:-${DDB_TABLE:-Inventory}}
      - ORDER_SNS_TOPIC_ARN=${ORDER_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:order-events}
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
      - BULK_STORAGE_DIR=/tmp/bulk_imports
      # Catalog data lives in schema `catalog`. Local dev connects as postgres;
      # production uses the least-privilege catalog_svc role.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${CATALOG_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${CATALOG_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      - POSTGRES_DB=ecommerce
      - POSTGRES_SSLMODE=disable
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-network

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    restart: unless-stopped
    # No source bind-mount: static-binary image, ENTRYPOINT runs it directly.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - INVENTORY_SERVICE_URL=${INVENTORY_SERVICE_URL:-http://catalog-service:8082}
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
      - ORDER_SNS_TOPIC_ARN=${ORDER_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:order-events}
      - PAYMENT_SNS_TOPIC_ARN=${PAYMENT_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:payment-events}
      - NOTIFICATION_SNS_TOPIC_ARN=${NOTIFICATION_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:notification-events}
      - STORE_CURRENCY=${STORE_CURRENCY:-USD}
      # Absorbed from payment-service: Stripe Checkout + webhook verification.
      - STRIPE_API_KEY=${STRIPE_API_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # Stripe success/cancel must hit the storefront (not admin on :3000).
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    # No source bind-mount: static-binary image (templates are baked in via
    # the Dockerfile's COPY --from=builder), ENTRYPOINT runs it directly.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8092/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - PORT=8092
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - SQS_QUEUE_URL=${NOTIFICATION_SQS_QUEUE_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_EMAIL:-}
      - SMTP_PASS=${SMTP_PASSWORD:-}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ecommerce
      - POSTGRES_SSLMODE=disable
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No source bind-mount here: the Dockerfile builds a static binary and
    # ENTRYPOINT runs that binary directly, so mounting source over it would
    # do nothing but mislead readers into thinking hot-reload works.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_EC2_METADATA_DISABLED=true
      - AWS_ENDPOINT=${AWS_ENDPOINT:-}
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-false}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/ecommerce/services}
      - CLOUDWATCH_NAMESPACE=${CLOUDWATCH_NAMESPACE:-ECommerce}
      - RATE_LIMIT_GLOBAL=${RATE_LIMIT_GLOBAL:-1000}
      - RATE_LIMIT_STRICT=${RATE_LIMIT_STRICT:-30}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      # Comma-separated CIDRs of reverse proxies allowed to set
      # X-Forwarded-For (e.g. an ALB/nginx in front of this container). Left
      # unset here because nothing sits in front of the gateway in this
      # compose stack — gin.ClientIP() then trusts no forwarded header at
      # all, closing the IP-spoofing gap that made rate limiting bypassable.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - ecommerce-network

  agent-service:
    build:
      context: ./services/agent-service
      dockerfile: Dockerfile
    restart: unless-stopped
    # Kept (unlike the Go services above): this image runs `uvicorn` directly
    # against /app with no compile step, so the mount is a real dev
    # convenience, not a vestigial leftover.
    volumes:
      - ./services/agent-service:/app
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    env_file:
      - .env
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - ALLOW_AUTO_MIGRATE=${ALLOW_AUTO_MIGRATE:-true}
      - ENVIRONMENT=development
      - LOG_LEVEL=info
      - HOST=0.0.0.0
      - PORT=8000
      # Agent calls domain APIs through api-gateway (TOOL_API_BASE_URL).
      - BFF_TIMEOUT=15
      # FIX: Set your current active ngrok URL here.
      # Free ngrok tunnels change on restart — use a static domain:
      #   ngrok http --domain=your-fixed-name.ngrok-free.app 11434
      - LLM_SERVICE_URL=${LLM_SERVICE_URL}
      - LLM_TIMEOUT=30
      - CONCURRENT_TOOL_LIMIT=10
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - ecommerce-network

  stripe-cli:
    image: stripe/stripe-cli:latest
    restart: unless-stopped
    command: listen --forward-to http://api-gateway:8080/stripe/webhook
    env_file:
      - .env
    depends_on:
      - api-gateway
    networks:
      - ecommerce-network

  docs:
    image: swaggerapi/swagger-ui:latest
    restart: unless-stopped
    ports:
      - "8099:8080"
    volumes:
      - ./docs/openapi.yaml:/tmp/openapi.yaml:ro
    environment:
      - SWAGGER_JSON=/tmp/openapi.yaml
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
