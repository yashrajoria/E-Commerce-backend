# Optional overlay: publish microservice ports for local debugging.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.localstack.yml -f docker-compose.dev-ports.yml up -d
services:
  identity-service:
    ports:
      - "8081:8081"
  catalog-service:
    ports:
      - "8082:8082"
  order-service:
    ports:
      - "8083:8083"
  notification-service:
    ports:
      - "8092:8092"
  agent-service:
    ports:
      - "8089:8000"