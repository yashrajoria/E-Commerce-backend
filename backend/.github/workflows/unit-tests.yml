name: Unit Tests

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  go-unit:
    name: go test (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - path: services/identity-service
          - path: services/catalog-service
          - path: services/order-service
          - path: api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/${{ matrix.service.path }}/go.sum
      - name: Download modules
        working-directory: backend/${{ matrix.service.path }}
        run: go mod download
      - name: Run tests
        working-directory: backend/${{ matrix.service.path }}
        run: go test ./... -count=1
